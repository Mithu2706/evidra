# Render Blueprint: Evidra public demo as ONE free web service.
# The Dockerfile builds the frontend and serves it from the FastAPI backend,
# so there is a single URL and no CORS setup. Demo settings (guest sign-in,
# heuristic AI, OCR off, SQLite in /tmp) are defaults in the Dockerfile.
#
# The free plan sleeps after ~15 minutes without traffic; the next request
# wakes it (~50 s). Every start rebuilds the fictional demo data, so each wake
# begins from a clean state. Nothing here is persistent; do not put real data
# in this service.
#
# (Split hosting is also supported: deploy frontend/ to Vercel with
# VITE_API_BASE_URL + VITE_DEMO_MODE=true and set EVIDRA_CORS_ORIGINS here.)
services:
  - type: web
    name: evidra-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Token-signing key: Render generates a random value; never committed.
      - key: EVIDRA_SECRET_KEY
        generateValue: true
